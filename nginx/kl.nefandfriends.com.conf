# 家庭账本 kl.nefandfriends.com
# 放置到 /etc/nginx/sites-available/kl.conf（或 conf.d/kl.conf），
# 然后 ln -s 到 sites-enabled/ 并 nginx -s reload。

server {
    listen 80;
    server_name kl.nefandfriends.com;

    client_max_body_size 1m;

    access_log /var/log/nginx/kl.access.log;
    error_log  /var/log/nginx/kl.error.log;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

